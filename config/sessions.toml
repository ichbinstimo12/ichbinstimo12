# Handelsfenster fuer Daytrading in der ORTSZEIT der jeweiligen Boerse (session_tz).
# Sommer-/Winterzeit wird automatisch beruecksichtigt (zoneinfo), damit die Firma 24/7 ohne Eingriff laeuft.
# entry_start_h .. entry_end_h: neue Einstiege erlaubt; flat_h: spaetestens dann wird glattgestellt
# (keine Position ueber Nacht -> keine Uebernacht-Finanzierung, kein Gap-Risiko ueber Nacht).
# ANNAHME: die liquideste Phase (London-Vormittag bis New-York-Mittag) ist fuer Daytrading am guenstigsten.

[default]
session_tz = "Europe/London"
entry_start_h = 7.0
entry_end_h = 19.0
flat_h = 20.0

[epic.EURUSD]
session_tz = "Europe/London"
entry_start_h = 7.0
entry_end_h = 16.0
flat_h = 19.5

[epic.GOLD]
session_tz = "Europe/London"
entry_start_h = 8.0
entry_end_h = 18.0
flat_h = 20.0

[epic.BTCUSD]
session_tz = "Europe/London"
entry_start_h = 8.0
entry_end_h = 20.0
flat_h = 21.0

[epic.AAPL]
# US-Kassasitzung 09:30-16:00 New York; die erste halbe Stunde ist die Eroeffnungsspanne
session_tz = "America/New_York"
entry_start_h = 9.5
entry_end_h = 14.5
flat_h = 15.75
