# Memecoin-Desk: harte Risikoregeln. Nur der Operator aendert diese Datei von Hand.
# Kein Agent, kein Coach und kein Prompt kann sie aendern (der Coach liest nur config/memedesk.toml).

[capital]
paper_start_sol = 10.0          # simuliertes Desk-Kapital im PAPER-Modus (eigenes Wallet, getrennt von der Firma)

[trade]
risk_per_trade = 0.015          # 1,5 % des Desk-Kapitals pro Trade (Einsatz, erlaubt: 0.01 - 0.02)
max_open_positions = 5
hard_stop_pct = 0.30            # harter Stop -30 % je Trade

[desk]
daily_loss_limit = 0.05         # -5 % am Tag -> Desk pausiert bis zum naechsten UTC-Tag
max_drawdown_limit = 0.20       # -20 % vom Hoechststand -> Desk stoppt komplett, Wiederanlauf nur durch Operator

[live]
# LIVE erst nach mind. 4 Wochen PAPER mit mind. 100 Trades und positivem Ergebnis (wird im Code geprueft)
min_paper_days = 28
min_paper_trades = 100
confirm_above_sol = 0.2         # jeder LIVE-Kauf darueber braucht eine Bestaetigung per App
