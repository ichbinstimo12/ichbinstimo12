# Memecoin-Desk (Solana): Schwellenwerte und Gewichte. Der Coach darf die Werte unter [weights] und [thresholds]
# nur innerhalb von [bounds] und nur nach Backtest auf dem eigenen Journal anpassen (versioniert in data/memedesk/).
# Risikoregeln stehen in config/memedesk_limits.toml und sind fuer niemanden ausser dem Operator aenderbar.

[loop]
scan_seconds = 20               # Scout: neue/trendende Tokens
manage_seconds = 5              # offene Positionen pruefen (Exits)
max_candidates = 25             # so viele Tokens je Runde grob pruefen (DexScreener)
deep_checks = 6                 # davon die besten tief pruefen (RugCheck, Honeypot-Quote, Kerzen)

[universe]
dexes = ["pumpswap", "raydium", "meteora", "pumpfun", "meteoradbc"]
min_liquidity_usd = 25000
max_age_hours = 72              # aelter = kein "neuer" Token mehr
min_volume_h1_usd = 20000

[safety]                         # Veto des Safety-Checkers (jede Bedingung allein reicht fuer ein Veto)
max_top_holder_pct = 15.0       # Dev/Insider/einzelne Wallet ueber 15 %
max_top10_pct = 35.0
min_lp_locked_pct = 90.0
max_rugcheck_score = 5000       # RugCheck-Score (hoeher = riskanter)
max_roundtrip_loss_pct = 12.0   # Kauf+Verkauf-Quote (Honeypot/Illiquiditaet)
block_risk_levels = ["danger"]  # RugCheck-Risiken dieser Stufe -> Veto

[thresholds]
min_signals = 3                 # Einstieg nur bei mindestens 3 von 5 Signalen
narrative_min = 0.5
volume_growth_min = 1.5         # Volumen 5 min vs. Schnitt der letzten Stunde
buy_ratio_min = 1.3             # Kaeufe/Verkaeufe (5 min)
chase_m5_pct = 25.0             # > 25 % in 5 min ohne Konsolidierung = "senkrechter Pump" -> nicht hinterherrennen
smart_wallets_min = 2           # mindestens 2 Smart-Money-Wallets kaufen frueh

[exits]
free_ride_at_pct = 100.0        # bei +100 %: Einsatz rausnehmen (Free Ride)
tiers = [[200.0, 0.25], [400.0, 0.25]]   # weitere Stufen: (+%, Anteil der Restposition)
trailing_pct = 30.0             # Trailing-Stop auf den Rest (vom Hoch)
time_stop_minutes = 45          # bewegt sich der Trade so lange nicht (+/- 10 %), wird er geschlossen
time_stop_band_pct = 10.0

[weights]                        # Gewichte der 5 Signale fuer den Score (Watchlist-Rangfolge)
narrative = 1.0
volume_holders = 1.0
smart_money = 1.0
distribution = 1.0
structure = 1.0

[bounds]                         # Spielraum des Coaches (min, max)
narrative = [0.5, 2.0]
volume_holders = [0.5, 2.0]
smart_money = [0.5, 2.0]
distribution = [0.5, 2.0]
structure = [0.5, 2.0]
narrative_min = [0.3, 0.8]
volume_growth_min = [1.2, 3.0]
buy_ratio_min = [1.1, 2.0]
chase_m5_pct = [15.0, 40.0]

[execution]
slippage_bps_min = 100
slippage_bps_max = 1500         # dynamisch: je nach Preis-Impact der Jupiter-Quote
priority_fee_sol = 0.0005       # PAPER rechnet diese Gebuehr je Transaktion ein
dex_fee_pct = 0.25              # Swap-Gebuehr je Seite (ANNAHME, je nach Pool 0.25-1 %)

[sources]
dexscreener = "https://api.dexscreener.com"
rugcheck = "https://api.rugcheck.xyz/v1"
jupiter = "https://lite-api.jup.ag"
geckoterminal = "https://api.geckoterminal.com/api/v2"
# RPC: SOLANA_RPC_URL in .env (z. B. Helius); ohne Angabe der oeffentliche Endpunkt (stark begrenzt)
default_rpc = "https://api.mainnet-beta.solana.com"
